server:
  port: ${BACKEND_PORT:8082}
  servlet:
    context-path: /

spring:
  application:
    name: web-kaofa
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.barn.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: '1'
      logic-not-delete-value: '0'

jwt:
  secret: ${JWT_SECRET}
  expire: 86400
  header: Authorization

upload:
  path: ${UPLOAD_PATH:./upload/}

logging:
  level:
    com.barn: info
    org.springframework: warn


security:
  cors:
    # 生产环境必须通过 CORS_ALLOWED_ORIGINS 配置实际可信前端域名，多个 Origin 用逗号分隔。
    # 禁止配置为 "*"；SecurityConfig 会拒绝空白名单或通配符。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
