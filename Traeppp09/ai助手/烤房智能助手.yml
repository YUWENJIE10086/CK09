    - data:
        code: "import json\nfrom urllib.parse import quote\n\n\ndef main(llm_output:\
          \ str) -> dict:\n    text = llm_output or \"\"\n\n    # 从 LLM 输出中提取 JSON\n\
          \    try:\n        start = text.find(\"{\")\n        end = text.rfind(\"\
          }\")\n        if start != -1 and end != -1:\n            data = json.loads(text[start:end\
          \ + 1])\n        else:\n            data = {}\n    except Exception:\n \
          \       data = {}\n\n    # 提取参数\n    action = data.get(\"action\", \"barns\"\
          )\n    county = data.get(\"county\", \"\")\n    use_status = data.get(\"\
          use_status\", \"\")\n    health_level = data.get(\"health_level\", \"\"\
          )\n    life_condition = data.get(\"life_condition\", \"\")\n    project_id\
          \ = data.get(\"projectId\", \"\")\n\n    # 后端 API 基础地址\n    # 如果 Dify 在\
          \ Docker 里，把 localhost 换成 host.docker.internal\n    # 如果在远程服务器，换成实际 IP\n\
          \    base = \"http://10.69.131.28:8082/barn/ai-query\"\n\n    # 根据 action\
          \ 拼接不同的 API URL\n    if action == \"detail\" and project_id:\n        url\
          \ = f\"{base}/detail?projectId={quote(project_id)}\"\n\n    elif action\
          \ == \"overview\":\n        url = f\"{base}/overview\"\n\n    elif action\
          \ == \"stats\":\n        url = f\"{base}/stats\"\n        if county:\n \
          \           url += f\"?county={quote(county)}\"\n\n    else:  # barns\n\
          \        params = []\n        if county:\n            params.append(f\"\
          county={quote(county)}\")\n        if use_status:\n            params.append(f\"\
          useStatus={quote(use_status)}\")\n        if health_level:\n           \
          \ params.append(f\"healthLevel={quote(health_level)}\")\n        if life_condition:\n\
          \            params.append(f\"lifeCondition={quote(life_condition)}\")\n\
          \        params.append(\"limit=500000\")\n        url = f\"{base}/barns?\"\
          \ + \"&\".join(params)\n\n    return {\n        \"url\": url,\n        \"\
          action\": action\n    }"
        code_language: python3
        outputs:
