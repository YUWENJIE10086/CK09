name: Web backend build and security check

on:
  push:
    branches:
      - main
      - security/web-audit-fix
      - security/web-audit-fix-v2
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Traeppp09/ruoyi-barn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven test
        run: mvn -B test

      - name: Maven package
        run: mvn -B -DskipTests package

      - name: Security baseline scan
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          target="Traeppp09/ruoyi-barn"
          echo "Checking for common committed secrets/debug settings..."

          if grep -RInE --exclude-dir=.git --exclude='*.min.js' --exclude='*.map'             '(^|[[:space:]])DEBUG[[:space:]]*=[[:space:]]*true([[:space:]]|$)' "$target"; then
            echo "Security baseline check failed: DEBUG=true detected."
            exit 1
          fi

          if grep -RInE --exclude-dir=.git --exclude='*.min.js' --exclude='*.map'             -- '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' "$target"; then
            echo "Security baseline check failed: private key detected."
            exit 1
          fi

          echo "Security baseline check passed."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Traeppp09
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Traeppp09/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency audit snapshot
        run: npm audit --json > npm-audit.json || true
        node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities||a.vulnerabilities,null,2))"

      - name: Type check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build
