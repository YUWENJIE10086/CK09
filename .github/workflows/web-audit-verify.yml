name: Web Audit Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'Traeppp09/ruoyi-barn/**'
      - '.github/workflows/web-audit-verify.yml'
  pull_request:
    paths:
      - 'Traeppp09/ruoyi-barn/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Traeppp09/ruoyi-barn
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Traeppp09/ruoyi-barn/pom.xml
      - name: Compile and test
        run: mvn -B test
